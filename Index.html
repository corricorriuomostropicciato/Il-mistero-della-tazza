<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween – La tazza scomparsa 🎃</title>
    <style>
        :root {
            --bg-color: #0d0b12;
            --panel-bg: #161320;
            --border-color: #ff6600;
            --text-color: #f0f0f0;
            --accent-orange: #ff6600;
            --accent-purple: #9b59b6;
            --btn-bg: #221c30;
            --btn-hover: #ff6600;
            --btn-text-hover: #0d0b12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--panel-bg);
            border: 3px solid var(--border-color);
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.3);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            background: linear-gradient(90deg, #1f162c, #2a1b3d);
            border-bottom: 2px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-size: 1.1rem;
            color: var(--accent-orange);
            font-weight: bold;
            text-shadow: 2px 2px #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .icon-btn {
            background: #111;
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--accent-orange);
            color: #111;
        }

        #main-content {
            padding: 20px;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1.splash-title {
            font-size: 2.2rem;
            color: var(--accent-orange);
            text-align: center;
            margin-top: 15px;
            text-shadow: 3px 3px var(--accent-purple);
        }

        .splash-subtitle {
            text-align: center;
            color: #b19cd9;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .splash-art {
            text-align: center;
            font-size: 3.5rem;
            margin: 10px 0;
            letter-spacing: 10px;
        }

        .story-box {
            background: rgba(0, 0, 0, 0.4);
            border-left: 4px solid var(--accent-orange);
            padding: 15px;
            border-radius: 0 4px 4px 0;
            line-height: 1.6;
            font-size: 1.05rem;
            max-height: 220px;
            overflow-y: auto;
        }

        .story-box p {
            margin-bottom: 10px;
        }

        .story-box p:last-child {
            margin-bottom: 0;
        }

        .dog-bubble {
            background: rgba(155, 89, 182, 0.15);
            border: 1px dashed var(--accent-purple);
            padding: 10px 15px;
            border-radius: 6px;
            font-style: italic;
            color: #dcd0ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .choice-btn {
            background-color: var(--btn-bg);
            border: 1px solid #443c59;
            color: var(--text-color);
            padding: 12px 15px;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .choice-btn:hover {
            background-color: var(--btn-hover);
            color: var(--btn-text-hover);
            border-color: var(--accent-orange);
            transform: translateX(4px);
            font-weight: bold;
        }

        .choice-key {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8rem;
            border: 1px solid currentColor;
        }

        .sidebar-panel {
            background: #110e17;
            border-top: 2px dashed #33294a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #aaa;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent-purple);
            width: 90%;
            max-width: 450px;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(155, 89, 182, 0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #33294a;
            padding-bottom: 8px;
            color: var(--accent-purple);
            font-weight: bold;
        }

        .close-modal {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-body ul {
            list-style-type: none;
            padding-left: 0;
        }

        .modal-body li {
            padding: 8px 0;
            border-bottom: 1px dotted #2a213d;
            font-size: 0.9rem;
        }

        footer.game-footer {
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            color: #666;
            background: #09070c;
            border-top: 1px solid #1a1523;
        }

        .ending-box {
            text-align: center;
            padding: 10px;
        }

        .ending-box h2 {
            color: var(--accent-orange);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        @media(max-width: 600px) {
            body { padding: 5px; }
            #game-container { border-width: 1px; }
            h1.splash-title { font-size: 1.6rem; }
            .story-box { font-size: 0.95rem; max-height: 190px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <div class="game-title">
                <span>🎃</span> Halloween – La tazza scomparsa
            </div>
            <div class="header-controls">
                <button class="icon-btn" id="btn-inv" onclick="openModal('modal-inventory')">Inventario (<span id="inv-count">0</span>)</button>
                <button class="icon-btn" id="btn-clues" onclick="openModal('modal-clues')">Indizi (<span id="clue-count">0</span>)</button>
                <button class="icon-btn" id="btn-audio" onclick="toggleAudio()">Audio: ON</button>
            </div>
        </header>

        <div id="main-content">
            <!-- Il contenuto dinamico del gioco viene iniettato qui -->
        </div>

        <div class="sidebar-panel">
            <div>Luogo: <span id="current-location" style="color:var(--accent-orange);">Schermata Iniziale</span></div>
            <div>🐶 Il cane biondo ti segue fedelmente</div>
        </div>

        <footer class="game-footer">
            Progetto PLAYIT &bull; Avventura Grafica Retrò 2000 &bull; 100% Unico File HTML
        </footer>
    </div>

    <!-- Modale Inventario -->
    <div id="modal-inventory" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>🎒 Inventario</span>
                <button class="close-modal" onclick="closeModal('modal-inventory')">&times;</button>
            </div>
            <div class="modal-body">
                <ul id="inventory-list">
                    <li>La borsa è vuota.</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Modale Indizi -->
    <div id="modal-clues" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>🔍 Indizi Raccolti</span>
                <button class="close-modal" onclick="closeModal('modal-clues')">&times;</button>
            </div>
            <div class="modal-body">
                <ul id="clues-list-modal">
                    <li>Nessun indizio scoperto finora.</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // --- MOTORE AUDIO WEB AUDIO API (Con timing sequenziale reale per loop di ~16-18 secondi) ---
        let audioCtx = null;
        let isAudioOn = true;
        let musicTimeout = null;
        let noteIndex = 0;

        const melodyPattern = [
            { f: 220,    dur: 350, wait: 900,  type: 'triangle' },
            { f: 261.63, dur: 300, wait: 600,  type: 'sine' },
            { f: 311.13, dur: 400, wait: 1400, type: 'triangle' },
            { f: 220,    dur: 350, wait: 900,  type: 'triangle' },
            { f: 110,    dur: 800, wait: 1200, type: 'sine' },
            { f: 659.25, dur: 150, wait: 2000, type: 'sine' },
            { f: 0,      dur: 100, wait: 2500, type: 'sine' }
        ];

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playNote(freq, duration, type) {
            if (!isAudioOn || !audioCtx || freq === 0) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (duration / 1000));

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + (duration / 1000));
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function scheduleNextNote() {
            if (!isAudioOn) return;
            
            const item = melodyPattern[noteIndex];
            if (item.f > 0) {
                playNote(item.f, item.dur, item.type);
            }
            
            noteIndex = (noteIndex + 1) % melodyPattern.length;
            
            musicTimeout = setTimeout(scheduleNextNote, item.wait);
        }

        function startBackgroundMusic() {
            if (musicTimeout) return;
            initAudioContext();
            noteIndex = 0;
            scheduleNextNote();
        }

        function stopBackgroundMusic() {
            if (musicTimeout) {
                clearTimeout(musicTimeout);
                musicTimeout = null;
            }
            noteIndex = 0;
        }

        function toggleAudio() {
            isAudioOn = !isAudioOn;
            const btn = document.getElementById('btn-audio');
            if (isAudioOn) {
                btn.textContent = "Audio: ON";
                startBackgroundMusic();
            } else {
                btn.textContent = "Audio: OFF";
                stopBackgroundMusic();
            }
        }

        // --- STATO DEL GIOCO ---
        let gameState = {
            inventory: [],
            clues: [],
            flags: {
                sawPhoto: false,
                checkedToothbrush: false,
                calledOldMan: false,
                foundBox: false,
                visitedHospital: false,
                visitedLunaPark: false,
                cupBroken: false,
                dogSuspected: false
            }
        };

        function addItem(item) {
            if (!gameState.inventory.includes(item)) {
                gameState.inventory.push(item);
                updateCounters();
            }
        }

        function addClue(clue) {
            if (!gameState.clues.includes(clue)) {
                gameState.clues.push(clue);
                updateCounters();
            }
        }

        function updateCounters() {
            document.getElementById('inv-count').textContent = gameState.inventory.length;
            document.getElementById('clue-count').textContent = gameState.clues.length;
            
            const invList = document.getElementById('inventory-list');
            if (gameState.inventory.length === 0) {
                invList.innerHTML = '<li>La borsa è vuota.</li>';
            } else {
                invList.innerHTML = gameState.inventory.map(i => `<li>🎒 ${i}</li>`).join('');
            }

            const cluesListModal = document.getElementById('clues-list-modal');
            if (gameState.clues.length === 0) {
                cluesListModal.innerHTML = '<li>Nessun indizio scoperto finora.</li>';
            } else {
                cluesListModal.innerHTML = gameState.clues.map(c => `<li>🔍 ${c}</li>`).join('');
            }
        }

        function setLocation(locName) {
            document.getElementById('current-location').textContent = locName;
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // --- SCHERMATA INIZIALE ---
        function renderSplash() {
            setLocation("Schermata Iniziale");
            stopBackgroundMusic();
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="splash-art">🎃 ☕ 🐕</div>
                    <h1 class="splash-title">Halloween<br>La tazza scomparsa</h1>
                    <div class="splash-subtitle">Un'avventura narrativa tra Veneto, misteri e Golden Retriever</div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="choice-btn" style="justify-content: center; font-size: 1.1rem; background: var(--accent-orange); color: #0d0b12; font-weight: bold;" onclick="startGame()">
                            ▶ INIZIA L'AVVENTURA
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame() {
            initAudioContext();
            if (isAudioOn) {
                startBackgroundMusic();
            }
            renderPrologue();
        }

        // --- PROLOGO: CASA ---
        function renderPrologue() {
            setLocation("Casa - Cucina");
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="story-box">
                        <p>È la notte di Halloween. Ti alzi dal divano per bere un goccio d'acqua, vai in cucina e... ti blocchi.</p>
                        <p><b>"Ma dove xé finia la me tazza?"</b></p>
                    </div>
                    <div class="dog-bubble">
                        <span>🐶</span> Il tuo grosso Golden Retriever biondo ti guarda con due occhioni grandi, innocentissimi e totalmente vuoti. Sembra estraneo a qualsiasi forma di colpa.
                    </div>
                    <div class="choices-container">
                        <button class="choice-btn" onclick="renderKitchenSearch()"><span class="choice-key">A</span> Cercare nella cucina.</button>
                        <button class="choice-btn" onclick="renderRoomSearch()"><span class="choice-key">B</span> Controllare la tua stanza.</button>
                        <button class="choice-btn" onclick="renderAskDog()"><span class="choice-key">C</span> Chiedere al cane dove sia.</button>
                    </div>
                </div>
            `;
        }

        function renderKitchenSearch() {
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="story-box">
                        <p>Apri i cassetti della cucina tra posate disordinate e vecchie scatole di tè. La tazza non c'è, ma rovistando in fondo trovi una vecchia fotografia di famiglia.</p>
                        <p>Osservi i tuoi genitori adottivi sorridenti. Nello sfondo, posteggiata sulla ghiaia, c'è una vecchia macchina squadrata.</p>
                    </div>
                    <div class="choices-container">
                        <button class="choice-btn" onclick="inspectPhotoFront()"><span class="choice-key">1</span> Guardare attentamente la macchina sullo sfondo.</button>
                        <button class="choice-btn" onclick="inspectPhotoBack()"><span class="choice-key">2</span> Girare la fotografia e leggere il retro.</button>
                        <button class="choice-btn" onclick="proceedToPhone()"><span class="choice-key">3</span> Lasciare perdere la foto e passare alla rubrica telefonica.</button>
                    </div>
                </div>
            `;
        }

        function inspectPhotoFront() {
            gameState.flags.sawPhoto = true;
            addClue("Fotografia: Riconosciuta la macchina del 1988 sullo sfondo.");
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="story-box">
                        <p>Aguzzi la vista. Quella targa e quel paraurti ammaccato... è la stessa identica macchina che vedrai tra poco nel parcheggio fuori casa.</p>
                        <p>Un brivido freddo ti attraversa la schiena, misto a fastidio per la tazza sparita.</p>
                    </div>
                    <div class="choices-container">
                        <button class="choice-btn" onclick="proceedToPhone()"><span class="choice-key">→</span> Continuare l'indagine in casa.</button>
                    </div>
                </div>
            `;
        }

        function inspectPhotoFront() {
            gameState.flags.sawPhoto = true;
            addClue("Fotografia: Riconosciuta la macchina del 1988 sullo sfondo.");
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="story-box">
                        <p>Aguzzi la vista. Quella targa e quel paraurti ammaccato... è la stessa identica macchina che vedrai tra poco nel parcheggio fuori casa.</p>
                        <p>Un brivido freddo ti attraversa la schiena, misto a fastidio per la tazza sparita.</p>
                    </div>
                    <div class="choices-container">
                        <button class="choice-btn" onclick="proceedToPhone()"><span class="choice-key">→</span> Continuare l'indagine in casa.</button>
                    </div>
                </div>
            `;
        }

        function inspectPhotoBack() {
            addClue("Retro foto: 'E. Moretti – 13 ottobre 1988 – Padiglione 3'");
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="story-box">
                        <p>Sul retro della foto, scritto a mano con un inchiostro sbiadito:</p>
                        <p><i>"E. Moretti – 13 ottobre 1988 – Padiglione 3"</i></p>
                    </div>
                    <div class="choices-container">
                        <button class="choice-btn" onclick="proceedToPhone()"><span class="choice-key">→</span> Posare la foto e controllare il resto della casa.</button>
                    </div>
                </div>
            `;
        }

        function renderRoomSearch() {
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="story-box">
                        <p>Vai nella tua stanza. Cerchi sotto il letto tra calzini spaiati e polvere millenaria. Della tazza nessuna traccia.</p>
                        <p>Il cane ti segue trotterellando e si ferma davanti all'armadio chiuso, dandosi una grattata all'orecchio.</p>
                    </div>
                    <div class="choices-container">
                        <button class="choice-btn" onclick="renderAskDog()"><span class="choice-key">1</span> Chiedere al cane perché punta l'armadio.</button>
                        <button class="choice-btn" onclick="proceedToPhone()"><span class="choice-key">2</span> Ignorare il cane e andare a consultare la rubrica.</button>
                    </div>
                </div>
            `;
        }

        function renderAskDog() {
            gameState.flags.checkedToothbrush = true;
            addItem("Spazzolino con la 'M'");
            addClue("Trovato uno spazzolino con la lettera 'M' nascosto nell'armadio dal cane.");
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="story-box">
                        <p>Segui il cane. Con il muso spinge l'anta socchiusa dell'armadio. All'interno, nascosto dietro vecchie scatole di scarpe, trovi un vecchio spazzolino da denti con una piccola lettera "M" incisa sul manico.</p>
                        <p>Un indizio bizzarro e apparentemente inutile, ma lo metti in tasca.</p>
                    </div>
                    <div class="dog-bubble">
                        <span>🐶</span> Il cane emette un piccolo abbaio soddisfatto e scodinzola piano.
                    </div>
                    <div class="choices-container">
                        <button class="choice-btn" onclick="proceedToPhone()"><span class="choice-key">→</span> Andare in salotto alla ricerca di risposte.</button>
                    </div>
                </div>
            `;
        }

        // --- RUBRICA E TELEFONO ---
        function proceedToPhone() {
            setLocation("Casa - Salotto");
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="story-box">
                        <p>Ti sposti in salotto. Sopra la vecchia scrivania di legno c'è una rubrica telefonica impolverata della famiglia.</p>
                        <p>Sfoghi la frustrazione per la tazza e cerchi la voce <b>"MORETTI"</b>. Accanto al numero compaiono due note minacciose:</p>
                        <p><i>"Non chiamare dopo il 13."</i><br><i>"Se chiedono della Sardegna, dire che non sappiamo niente."</i></p>
                    </div>
                    <div class="choices-container">
                        <button class="choice-btn" onclick="callMoretti()"><span class="choice-key">1</span> Chiamare il numero.</button>
                        <button class="choice-btn" onclick="continueSearchHome()"><span class="choice-key">2</span> Cercare ancora indizi sulla tazza in giro per casa.</button>
                        <button class="choice-btn" onclick="killMosquito()"><span class="choice-key">3</span> Usare la pesante rubrica per ammazzare una zanzara ostinata sul muro.</button>
                    </div>
                </div>
            `;
        }

        function callMoretti() {
            gameState.flags.calledOldMan = true;
            addClue("Telefonata a Moretti: 'Non portare il Golden Retriever al Padiglione 3.'");
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="story-box">
                        <p>Componi il numero. Dopo tre squilli, risponde una voce maschile roca e anziana.</p>
                        <p>Parli della foto, di Moretti e del 13 ottobre 1988. L'uomo ti interrompe gelido: <i>"Da dove l'hai presa?"</i></p>
                        <p>Rispondi: <b>"Me l'ha portata el me can."</b></p>
                        <p>L'uomo chiede che cane sia. Tu dici: <i>"Un Golden Retriever. Maschio. Biondo."</i></p>
                        <p>L'uomo cambia repentinamente tono, urlando: <b>"Allora non portarlo al Padiglione 3!"</b> E riattacca bruscamente.</p>
                    </div>
                    <div class="choices-container">
                        <button class="choice-btn" onclick="goToParking()"><span class="choice-key">→</span> Uscire di casa e andare al Parcheggio.</button>
                    </div>
                </div>
            `;
        }

        function continueSearchHome() {
            const content = document.getElementById('main-content');
            content.innerHTML = `
                <div class="screen">
                    <div class="story-box">
                        <p>Ispezioni ogni angolo del salotto, sposti i cuscini del divano. Niente tazza. Però la rubrica ti sfugge di mano e cade fragorosamente a terra, aprendosi spalancata...</p>
                    </div>
                    <div class="choices-container">
