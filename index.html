<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Halloween — La Tazza Scomparsa</title><style>html,body{margin:0;height:100%;background:#09070b;color:#eee;font-family:Georgia,serif;overflow:hidden}*{box-sizing:border-box}.game{width:min(1100px,100vw);height:min(680px,100vh);position:relative;background:#141018;border:2px solid #39263b;overflow:hidden}.screen{position:absolute;inset:0}.start{display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#34202e,#0b080d 70%)}.start h1{font-size:clamp(32px,6vw,66px);margin:0 0 10px;color:#e6b46b;text-shadow:0 4px #24131e}.start p{color:#c7b9c9}.btn{border:1px solid #a16b42;background:#24151f;color:#f2d5ad;padding:13px 20px;margin:8px;border-radius:5px;font:inherit;cursor:pointer}.world{display:none;background:#111}.hud{position:absolute;left:0;right:0;top:0;height:58px;background:#130e17ee;z-index:20;padding:12px 16px;display:flex;justify-content:space-between}.place{font-weight:bold;color:#e3b675}.hint{color:#d8cad8;font-size:14px}.scene{position:absolute;inset:58px 0 72px;overflow:hidden;background:#1b1820}.strip{position:absolute;left:0;top:0;height:100%;min-width:1500px}.ground{position:absolute;bottom:0;height:18%;left:0;right:0;background:#17131a;border-top:2px solid #493343}.sky{position:absolute;inset:0;background:linear-gradient(#16111d,#28202b 62%,#17131b)}.moon{position:absolute;width:90px;height:90px;border-radius:50%;background:#d8c99e;right:9%;top:9%;box-shadow:0 0 35px #c7ae7755}.star{position:absolute;width:3px;height:3px;background:#d8c9ae;border-radius:50%}.room{position:absolute;bottom:18%;height:62%;border:3px solid #3f2a42;background:#25202a}.room .label{position:absolute;top:8px;left:12px;color:#b9a4b9;font-size:13px}.door{position:absolute;bottom:0;width:80px;height:150px;background:#17121a;border:3px solid #684552;cursor:pointer}.window{position:absolute;width:150px;height:100px;background:#101820;border:4px solid #543b55}.prop{position:absolute;bottom:18%;cursor:pointer}.prop .label{position:absolute;top:-24px;left:0;color:#b9a4b9;font-size:12px;white-space:nowrap}.table{width:160px;height:25px;background:#69432e;border-radius:3px}.table:after{content:"";position:absolute;left:18px;right:18px;top:22px;height:80px;border-left:10px solid #4b3025;border-right:10px solid #4b3025}.cab{width:100px;height:140px;background:#49302f;border:4px solid #70494a}.sofa{width:220px;height:75px;background:#493b4c;border:4px solid #625067;border-radius:14px}.car{position:absolute;bottom:18%;width:350px;height:100px;background:#3c3940;border-radius:60px 80px 15px 15px;border:5px solid #655a65}.car:before,.car:after{content:"";position:absolute;bottom:-25px;width:55px;height:55px;background:#151318;border-radius:50%;border:5px solid #4a414b}.car:before{left:45px}.car:after{right:45px}.car .trunk{position:absolute;right:10px;top:12px;width:95px;height:45px;border:3px solid #7a6b76;background:#302b32}.building{position:absolute;bottom:18%;left:180px;width:950px;height:65%;background:#28272b;border:5px solid #4b4850}.building:before{content:"PADIGLIONE 3";position:absolute;top:20px;left:30px;color:#837b86;font:700 24px monospace;letter-spacing:5px}.win{position:absolute;width:90px;height:110px;background:#11151a;border:4px solid #55515a;bottom:25%}.door2{position:absolute;bottom:18%;left:640px;width:100px;height:190px;background:#111;border:4px solid #5c515c}.wheel{position:absolute;width:300px;height:300px;border:7px solid #826173;border-radius:50%;bottom:20%;left:820px}.wheel:before,.wheel:after{content:"";position:absolute;background:#826173;left:50%;top:50%;transform-origin:left center}.wheel:before{width:140px;height:5px}.wheel:after{width:140px;height:5px;transform:rotate(90deg)}.cabin{position:absolute;width:45px;height:35px;border:3px solid #826173;background:#29202a}.mirrorPanel{position:absolute;bottom:18%;width:120px;height:380px;border:6px solid #6b5871;background:linear-gradient(110deg,#26303b,#12151b,#303946)}.mirrorPanel:after{content:"";position:absolute;inset:20px;border:1px solid #8d7891}.player,.dog{position:absolute;bottom:18%;z-index:10}.player{width:34px;height:70px}.player .head{width:28px;height:28px;border-radius:50%;background:#c99573;position:absolute;top:0;left:3px}.player .body{width:25px;height:35px;background:#496070;position:absolute;top:28px;left:5px;border-radius:4px}.player .legs{position:absolute;bottom:0;left:7px;width:7px;height:18px;background:#24212a;box-shadow:13px 0 #24212a}.dog{width:90px;height:55px}.dog .body{position:absolute;bottom:4px;left:12px;width:68px;height:38px;background:#d6a86d;border-radius:45% 55% 40% 40%;border:2px solid #9b7042}.dog .head{position:absolute;right:0;top:3px;width:45px;height:45px;background:#e0b477;border-radius:48%;border:2px solid #9b7042}.dog .ear{position:absolute;right:35px;top:7px;width:22px;height:30px;background:#8b633e;border-radius:60%;transform:rotate(25deg)}.dog .tail{position:absolute;left:0;bottom:27px;width:28px;height:10px;border-radius:10px;background:#e0b477;transform:rotate(-25deg)}.bubble{position:absolute;bottom:calc(18% + 95px);left:20px;right:20px;min-height:52px;background:#0d0b10e8;border:1px solid #75556f;border-radius:8px;padding:12px 16px;z-index:30;display:none}.bubble.show{display:block}.bubble b{color:#e4b66e}.objectHint{position:absolute;bottom:calc(18% + 5px);z-index:25;background:#0c0a0fdd;border:1px solid #806075;padding:6px 10px;border-radius:5px;display:none;font:13px monospace}.objectHint.show{display:block}.bottom{position:absolute;bottom:0;left:0;right:0;height:72px;background:#0d0a10;z-index:25;border-top:1px solid #3c293c;display:flex;align-items:center;justify-content:space-between;padding:8px 14px}.inv{font-size:12px;color:#bfaec0;max-width:70%;line-height:1.35}.controls{display:flex;gap:5px}.key{border:1px solid #514052;border-radius:4px;padding:5px 8px;color:#d5c5d6;font:12px monospace}.mobile{display:none;position:absolute;right:12px;bottom:80px;z-index:40;gap:5px}.mobile button{width:48px;height:48px;background:#201722dd;color:#eee;border:1px solid #795b73;border-radius:8px;font-size:18px;touch-action:none}.modal{position:absolute;inset:0;background:#09070ddd;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.panel{max-width:700px;background:#17121b;border:1px solid #6d5067;padding:25px;border-radius:8px;line-height:1.55;box-shadow:0 10px 50px #000}.panel h2{color:#e3b675;margin-top:0}.small{font-size:13px;color:#ad9fad}.end{font-size:18px}@media(max-width:700px){.game{height:100vh;border:0}.controls{display:none}.mobile{display:flex}.hint{display:none}.bottom{height:64px}.scene{inset:58px 0 64px}.bubble{bottom:calc(18% + 85px)}.player{transform:scale(.9);transform-origin:bottom}.dog{transform:scale(.85);transform-origin:bottom}}</style></head><body><div class="game"><section class="screen start" id="start"><div><div style="font-size:54px">🎃 ☕</div><h1>LA TAZZA SCOMPARSA</h1><p>Una notte di Halloween. Una tazza rotta. Una storia iniziata nel 1988.</p><button class="btn" id="newBtn">NUOVA PARTITA</button><button class="btn" id="continueBtn" style="display:none">CONTINUA</button><p class="small">← → / A D per camminare · E per interagire · Invio per continuare</p></div></section><section class="screen world" id="world"><div class="hud"><div class="place" id="place">CASA</div><div class="hint">← → cammina · E interagisci</div></div><div class="scene" id="scene"></div><div class="bubble" id="bubble"></div><div class="objectHint" id="objectHint"></div><div class="bottom"><div class="inv" id="inv">Inventario: vuoto</div><div class="controls"><span class="key">←</span><span class="key">→</span><span class="key">E</span><span class="key">INVIO</span></div></div><div class="mobile"><button data-key="left" aria-label="Vai a sinistra">◀</button><button data-key="right" aria-label="Vai a destra">▶</button><button data-key="interact" aria-label="Interagisci o continua">E</button></div></section><div class="modal" id="modal"><div class="panel" id="modalPanel"></div></div></div><script>
(function(){'use strict';
const $=id=>document.getElementById(id);
const SAVE='tazza_scomparsa_save_v5';
const scenes={casa:{name:'CASA',width:1800},parcheggio:{name:'PARCHEGGIO',width:1500},ospedale:{name:'PADIGLIONE 3',width:1900},lunapark:{name:'LUNA PARK',width:1900},specchi:{name:'CASA DEGLI SPECCHI',width:1700}};
const state={scene:'casa',x:220,inv:[],flags:{},discoveries:[],dogX:150,knowledge:0,dialog:null,dialogIndex:0,dialogAfter:null};
let keys={left:false,right:false},last=0;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}}
function has(f){return !!state.flags[f]}
function setFlag(f){state.flags[f]=true;if(!state.discoveries.includes(f))state.discoveries.push(f);save()}
function add(item){if(!state.inv.includes(item))state.inv.push(item);renderInv();save()}
function renderInv(){$('inv').textContent='Inventario: '+(state.inv.length?state.inv.join(' · '):'vuoto')}
function el(c,style,html){const d=document.createElement('div');d.className=c;if(style)d.style.cssText=style;if(html)d.innerHTML=html;return d}
function say(lines,after){state.dialog=lines;state.dialogIndex=0;state.dialogAfter=after||null;showDialog()}
function showDialog(){if(!state.dialog)return;const l=state.dialog[state.dialogIndex];$('bubble').innerHTML='<b>'+l[0]+'</b> '+l[1];$('bubble').classList.add('show')}
function advance(){if(!state.dialog)return false;state.dialogIndex++;if(state.dialogIndex>=state.dialog.length){const a=state.dialogAfter;state.dialog=null;state.dialogAfter=null;$('bubble').classList.remove('show');if(a)a()}else showDialog();return true}
function prop(x,c,label,a){const o=el('prop '+c,'left:'+x+'px','<span class="label">'+label+'</span>');o.dataset.x=x;o.dataset.action=a;return o}
function buildScene(){const root=$('scene');root.innerHTML='';const sc=scenes[state.scene],s=el('strip');s.style.width=sc.width+'px';root.appendChild(s);s.appendChild(el('sky'));for(let i=0;i<32;i++){let z=el('star');z.style.left=Math.random()*sc.width+'px';z.style.top=10+Math.random()*42+'%';s.appendChild(z)}s.appendChild(el('moon'));s.appendChild(el('ground'));if(state.scene==='casa')casa(s);if(state.scene==='parcheggio')parking(s);if(state.scene==='ospedale')hospital(s);if(state.scene==='lunapark')park(s);if(state.scene==='specchi')mirrors(s);let p=el('player');p.id='player';p.innerHTML='<div class="head"></div><div class="body"></div><div class="legs"></div>';s.appendChild(p);let d=el('dog');d.id='dog';d.innerHTML='<div class="body"></div><div class="head"></div><div class="ear"></div><div class="tail"></div>';s.appendChild(d);update()}
function casa(s){let r=el('room','left:70px;width:700px');r.innerHTML='<span class="label">CUCINA</span>';s.appendChild(r);s.appendChild(prop(240,'table','Tavolo','cup'));s.appendChild(prop(520,'cab','Credenza','cabinet'));s.appendChild(el('window','left:400px;bottom:48%'));let r2=el('room','left:800px;width:700px');r2.innerHTML='<span class="label">SOGGIORNO</span>';s.appendChild(r2);s.appendChild(prop(930,'sofa','Divano','sofa'));s.appendChild(prop(1200,'cab','Telefono','phone'));let d=el('door','left:720px');d.dataset.action='door';s.appendChild(d);s.appendChild(prop(1470,'cab','Armadio','wardrobe'))}
function parking(s){let car=el('car','left:260px');car.innerHTML='<div class="trunk"></div>';car.dataset.action='car';car.dataset.x=260;s.appendChild(car);s.appendChild(prop(650,'cab','Bagagliaio','box'));s.appendChild(prop(1000,'cab','Registratore','recorder'));let h=el('door','left:80px');h.dataset.action='home';s.appendChild(h);let g=el('door','left:1360px');g.dataset.action='parkingNext';g.innerHTML='<span class="label">Uscita</span>';s.appendChild(g)}
function hospital(s){s.appendChild(el('building'));for(let x=250;x<1150;x+=180)s.appendChild(el('win','left:'+x+'px;bottom:40%'));let d=el('door2');d.dataset.action='hospitalEnter';s.appendChild(d);s.appendChild(prop(880,'cab','Archivio','archive'));s.appendChild(prop(1120,'cab','Armadietto M.','locker'));s.appendChild(prop(1380,'cab','Registratore','hospitalrec'));s.appendChild(prop(1500,'cab','Foto sul muro','hospitalPhoto'));s.appendChild(prop(1580,'cab','Muro','wall'));s.appendChild(prop(1720,'cab','Stanza laterale','sideRoom'));let e=el('door','left:40px');e.dataset.action='parking';s.appendChild(e)}
function park(s){let g=el('door','left:50px');g.dataset.action='hospital';s.appendChild(g);s.appendChild(prop(380,'cab','Biglietteria','ticket'));s.appendChild(prop(520,'cab','Foto strappata','tornPhoto'));let w=el('wheel');w.dataset.action='wheel';w.dataset.x=820;s.appendChild(w);for(let i=0;i<8;i++)s.appendChild(el('cabin','left:'+(950+130*Math.cos(i*Math.PI/4))+'px;bottom:'+(35+22*Math.sin(i*Math.PI/4))+'%'));s.appendChild(prop(620,'cab','Cabina di controllo','control'));let e=el('door','left:1700px');e.dataset.action='mirrors';s.appendChild(e)}
function mirrors(s){for(let x=180;x<1450;x+=230){let m=el('mirrorPanel','left:'+x+'px');m.dataset.action='mirror';m.dataset.x=x;s.appendChild(m)}let e=el('door','left:1510px');e.dataset.action='home';s.appendChild(e)}
function update(){const root=$('scene'),strip=root.firstElementChild,p=$('player'),d=$('dog');if(!strip||!p||!d)return;p.style.left=state.x+'px';d.style.left=state.dogX+'px';const view=root.clientWidth,off=Math.max(-(scenes[state.scene].width-view),Math.min(0,view/2-state.x));strip.style.transform='translate3d('+off+'px,0,0)';hint()}
function near(){const s=$('scene').firstElementChild;if(!s)return null;let b=null,dist=Infinity;s.querySelectorAll('[data-action]').forEach(o=>{const x=parseFloat(o.dataset.x||o.style.left||0),d=Math.abs(state.x-x);if(d<dist&&d<100){dist=d;b=o}});return b}
function hint(){const o=near(),h=$('objectHint');if(!o){h.classList.remove('show');return}const x=parseFloat(o.dataset.x||o.style.left||state.x);h.textContent='E · '+(o.querySelector('.label')?.textContent||'interagisci');h.style.left=Math.max(10,Math.min($('scene').clientWidth-180,x-state.x+$('scene').clientWidth/2-70))+'px';h.classList.add('show')}
function move(dx){const sc=scenes[state.scene];state.x=Math.max(25,Math.min(sc.width-40,state.x+dx));const gap=state.x-state.dogX;if(Math.abs(gap)>150)state.dogX+=Math.sign(gap)*5;state.dogX+=(state.x-state.dogX)*0.08;update()}
function loop(t){if(!last)last=t;const dt=Math.min(.033,(t-last)/1000);last=t;if(keys.left)move(-300*dt);if(keys.right)move(300*dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function travel(to,x){state.scene=to;state.x=x||180;state.dogX=Math.max(25,state.x-75);save();buildScene();$('place').textContent=scenes[to].name;intro(to)}
function intro(to){if(to==='casa'&&!has('intro')){setFlag('intro');say([['','Ma dove xé finia la me tazza?'],['','Il Golden ti guarda. Fa finta di niente.'],['','È Halloween. Fuori è già buio.']])}if(to==='parcheggio'&&!has('parkIntro')){setFlag('parkIntro');say([['','Il vecchio parcheggio è quasi vuoto. Il cane annusa l’aria.'],['','Quella macchina... ti sembra stranamente familiare.']])}if(to==='ospedale'&&!has('hospitalIntro')){setFlag('hospitalIntro');say([['','Il cane si irrigidisce. Davanti a voi c’è il Padiglione 3.'],['','Le finestre sono nere. Non sembra esserci nessuno.']])}if(to==='lunapark'&&!has('parkIntro2')){setFlag('parkIntro2');say([['','Il luna park è spento. Solo la ruota panoramica è illuminata.'],['','Il cane tira leggermente il guinzaglio verso l’interno.']])}if(to==='specchi'&&!has('mirrorIntro')){setFlag('mirrorIntro');say([['','La casa degli specchi è aperta. Dentro non si sente nulla.'],['','Poi, per un attimo, nello specchio dietro di te compaiono due persone.']])}}
function action(a){if(a==='cup'){if(!has('searchedCup')){setFlag('searchedCup');say([['','La tazza non c’è. Solo un cerchietto di polvere sul tavolo.'],['','Il cane sbadiglia. Innocente. Troppo innocente.']])}else if(!has('fragment1')){setFlag('fragment1');add('frammento di ceramica');say([['','Sotto il tavolo trovi un piccolo frammento blu.'],['','Il cane guarda altrove.']])}else say([['','Niente. La tazza continua a essere scomparsa.']])}else if(a==='cabinet'){if(!has('photo')){setFlag('photo');add('foto di famiglia');say([['','Dietro una vecchia scatola trovi una fotografia.'],['','Sul retro: “E. Moretti — 13 ottobre 1988 — Padiglione 3”.'],['','Moretti. Quel nome ti dice qualcosa.']],()=>{setFlag('knowsMoretti');setFlag('knowsPadiglione3')})}else if(!has('toothbrush')){setFlag('toothbrush');add('spazzolino');say([['','In fondo al cassetto trovi uno spazzolino vecchio.'],['','Sul cappuccio c’è una M.']])}else say([['','Solo vecchie cose di casa.']])}else if(a==='phone'){if(!has('phonebook')){setFlag('phonebook');add('rubrica');say([['','Cerchi MORETTI nella vecchia rubrica.'],['','Numero trovato. Accanto: “Non chiamare dopo il 13.”'],['','E sotto: “Se chiedono della Sardegna, dire che non sappiamo niente.”']])}else if(!has('calledMoretti')){setFlag('calledMoretti');say([['Moretti','Pronto?'],['Tu','Sono io. Ho trovato una foto del 1988.'],['Moretti','Hai un Golden Retriever?'],['Tu','Sì.'],['Moretti','Allora non portarlo al Padiglione 3.'],['','CLICK. La linea cade. Il cane abbaia.']])}else say([['','Nessuno risponde.']])}else if(a==='sofa'){if(!has('searchedAgain')){setFlag('searchedAgain');say([['','Tra i cuscini trovi una ricevuta del 1988. Cagliari.'],['','Il cane si alza e va verso la porta.']])}else say([['','Il divano è vuoto. Il cane ti guarda.']])}else if(a==='wardrobe'){if(!has('phonebook'))say([['','Solo vestiti e polvere.']]);else{setFlag('knowsPadiglione3');say([['','Dietro una giacca trovi un biglietto: “Padiglione 3”.'],['','Non è una coincidenza.']])}}else if(a==='door')travel('parcheggio',120);else if(a==='home')travel('casa',1450);else if(a==='car'){if(has('photo')||has('knowsMoretti')){setFlag('noticedCar');say([['','Ora lo riconosci. È il modello della fotografia.'],['','Apri il bagagliaio. Dentro c’è una scatola con scritto: CAGLIARI — 13 ottobre 1988 — 22:47.']],()=>{add('scatola Cagliari');setFlag('foundBox');setFlag('knowsCagliari')})}else say([['','Una vecchia macchina. Ti sembra familiare, ma non sai perché.']])}else if(a==='box'){if(!has('foundBox'))say([['','Il bagagliaio è chiuso. La macchina però ti sembra familiare.']]);else if(!has('archiveKey')){setFlag('archiveKey');add('chiave dell’archivio');say([['','Nella scatola trovi una chiave e una cassetta.'],['','Etichetta: “Padiglione 3 — 23:15”.']])}else say([['','La scatola è vuota.']])}else if(a==='recorder'){if(!has('foundBox'))say([['','Un vecchio registratore. Non sai da dove venga.']]);else{setFlag('tape1');say([['Registrazione','Sono le ventitré e quindici.'],['','I due soggetti sono arrivati.'],['','Il bambino verrà consegnato alla famiglia domani mattina.'],['','Ma c’è un problema.']])}}else if(a==='parkingNext'){if(!has('knowsPadiglione3'))say([['','Non sai ancora dove porta quella strada.']]);else if(has('tape2')||has('wall'))travel('lunapark',120);else travel('ospedale',170)}else if(a==='hospitalEnter'){if(!has('hospitalInside')){setFlag('hospitalInside');say([['','Il corridoio odora di umidità.'],['','Da qualche parte cade una goccia.'],['','Il cane annusa una porta e poi ti guarda.']])}else say([['','Il corridoio continua nel buio.']])}else if(a==='archive'){if(has('archiveKey')&&!has('archiveFound')){setFlag('archiveFound');add('foto dei due sconosciuti');add('braccialetto ospedaliero');say([['','La chiave apre l’archivio.'],['','Dentro: una foto di due sconosciuti, un braccialetto e un documento.'],['','M. Moretti — 13/10/1988 — Consegnato al nucleo familiare.'],['','Sul retro: “Cagliari, 1988.”']],()=>state.knowledge++)}else say([['','Scaffali pieni di cartelle.']])}else if(a==='locker'){if(has('archiveFound')&&!has('hospitalFolder')){setFlag('hospitalFolder');add('cartella ospedaliera');setFlag('dog1988');say([['','Nell’armadietto M. trovi una cartella.'],['','“Il cane deve essere trasferito prima della consegna.”'],['','Perché parlano di un cane del 1988?'],['','Il tuo Golden ti guarda. Poi tira verso l’uscita.']])}else say([['','L’armadietto è chiuso o vuoto.']])}else if(a==='hospitalPhoto'){if(!has('hospitalPhotoSeen')){setFlag('hospitalPhotoSeen');say([['','Una fotografia scolorita mostra un corridoio del Padiglione 3.'],['','Sul bordo è scritto: 23:15.'],['','Per un istante la fotografia sembra diversa. Poi torna normale.']])}else say([['','Solo il corridoio vuoto della fotografia.']])}else if(a==='sideRoom'){if(!has('sideRoomSeen')){setFlag('sideRoomSeen');say([['','La stanza laterale è quasi vuota.'],['','A terra trovi un pezzo di stoffa nera.'],['','Il cane lo annusa e si allontana.']]);add('frammento di stoffa')}else say([['','La stanza è vuota.']])}else if(a==='hospitalrec'){if(!has('tape2')){setFlag('tape2');say([['Registrazione','Il bambino non deve sapere chi sono i suoi genitori.'],['','E soprattutto non deve sapere cosa è successo quella notte.'],['','Moretti pensa che sia tutto finito. Si sbaglia.'],['','Portate via il cane.'],['Tu','Perché cazzo hanno nominato te?']])}else say([['','Sul registratore c’è scritto: “Archivio audio — Padiglione 3”.'],['','Sul retro: “Luna Park — ingresso vecchio.”']])}else if(a==='wall'){if(!has('wall')){setFlag('wall');state.knowledge++;say([['','Sul muro: “13 • 10 • 88”'],['','Sotto: “NON ERA IL BAMBINO.”'],['','Il cane guarda verso il parcheggio.']])}else say([['','La scritta è sempre lì.']])}else if(a==='parking')travel('parcheggio',1200);else if(a==='ticket'){if(!has('ticketLog')){setFlag('ticketLog');add('registro del luna park');say([['','Registro: “13 ottobre 1988 — MORETTI — 3 PERSONE + 1 CANE”.'],['','Una voce sussurra: “Non dovevi function interact(){if(advance())return;const o=near();if(o)action(o.dataset.action)}

function finishCheck(){if(state.scene==='casa'&&has('parents')&&has('fragment1')&&!has('ending')){setFlag('ending');setTimeout(()=>{$('modalPanel').innerHTML='<h2>La tazza scomparsa</h2><div class="end">La foto sul tavolo dice: <i>13 ottobre 1988 — prima di consegnarlo.</i><br><br>“Consegnare chi?”<br><br>Il cane corre in camera. Lo segui. Sotto il letto trovi un altro frammento blu.<br><br>La verità sulla notte del 1988 era reale. Moretti, il bambino, i due genitori, il cane. Non era una leggenda.<br><br>E poi guardi il cane. Guarda te. Guarda il pavimento.<br><br>La tazza è dietro un mobile. Rotta.<br><br><b>Il colpevole era il tuo cane.</b><br><br>Ha passato tutta la notte a trascinarti in giro per il Veneto pur di evitare la sgridata.<br><br><span class="small">Cose scoperte sulla notte del 1988: '+state.knowledge+'/5</span></div><button class="btn" id="restart">RICOMINCIA</button>';$('modal').classList.add('show');$('restart').onclick=()=>{localStorage.removeItem(SAVE);location.reload()}},300)}}
function keydown(e){const k=e.key.toLowerCase();if(e.key==='ArrowLeft'||k==='a'){e.preventDefault();keys.left=true}else if(e.key==='ArrowRight'||k==='d'){e.preventDefault();keys.right=true}else if(k==='e'){e.preventDefault();interact()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()}}
function keyup(e){const k=e.key.toLowerCase();if(e.key==='ArrowLeft'||k==='a')keys.left=false;if(e.key==='ArrowRight'||k==='d')keys.right=false}
document.addEventListener('keydown',keydown);document.addEventListener('keyup',keyup);
function start(){ $('start').style.display='none';$('world').style.display='block';buildScene();$('place').textContent=scenes[state.scene].name;renderInv();introStart() }
$('newBtn').onclick=()=>{localStorage.removeItem(SAVE);Object.assign(state,{scene:'casa',x:220,inv:[],flags:{},discoveries:[],dogX:150,knowledge:0,dialog:null,dialogIndex:0,dialogAfter:null});start()};
$('continueBtn').onclick=()=>{if(load())start()};
if(localStorage.getItem(SAVE))$('continueBtn').style.display='inline-block';
function stop(){keys.left=false;keys.right=false}document.querySelectorAll('.mobile button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();if(b.dataset.key==='left')keys.left=true;else if(b.dataset.key==='right')keys.right=true;else interact()});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,stop))});
})();</script></body></html>
