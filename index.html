<!doctype html> <html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Halloween — La Tazza Scomparsa</title><style>html,body{margin:0;height:100%;background:#09070b;color:#eee;font-family:Georgia,serif;overflow:hidden}*{box-sizing:border-box}.game{width:min(1100px,100vw);height:min(680px,100vh);position:relative;background:#141018;border:2px solid #39263b;overflow:hidden}.screen{position:absolute;inset:0}.start{display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#34202e,#0b080d 70%)}.start h1{font-size:clamp(32px,6vw,66px);margin:0 0 10px;color:#e6b46b;text-shadow:0 4px #24131e}.start p{color:#c7b9c9}.btn{border:1px solid #a16b42;background:#24151f;color:#f2d5ad;padding:13px 20px;margin:8px;border-radius:5px;font:inherit;cursor:pointer}.world{display:none;background:#111}.hud{position:absolute;left:0;right:0;top:0;height:58px;background:#130e17ee;z-index:20;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.musicBtn{border:1px solid #71526d;background:#211725;color:#e7d5e5;border-radius:4px;padding:7px 10px;font:12px monospace;cursor:pointer}.startMusic{margin-top:10px}.place{font-weight:bold;color:#e3b675}.hint{color:#d8cad8;font-size:14px}.scene{position:absolute;inset:58px 0 72px;overflow:hidden;background:#1b1820}.strip{position:absolute;left:0;top:0;height:100%;min-width:1500px}.ground{position:absolute;bottom:0;height:18%;left:0;right:0;background:#17131a;border-top:2px solid #493343}.sky{position:absolute;inset:0;background:linear-gradient(#16111d,#28202b 62%,#17131b)}.moon{position:absolute;width:90px;height:90px;border-radius:50%;background:#d8c99e;right:9%;top:9%;box-shadow:0 0 35px #c7ae7755}.star{position:absolute;width:3px;height:3px;background:#d8c9ae;border-radius:50%}.room{position:absolute;bottom:18%;height:62%;border:3px solid #3f2a42;background:#25202a}.room .label{position:absolute;top:8px;left:12px;color:#b9a4b9;font-size:13px}.door{position:absolute;bottom:0;width:80px;height:150px;background:#17121a;border:3px solid #684552;cursor:pointer}.window{position:absolute;width:150px;height:100px;background:#101820;border:4px solid #543b55}.prop{position:absolute;bottom:18%;cursor:pointer}.prop .label{position:absolute;top:-24px;left:0;color:#b9a4b9;font-size:12px;white-space:nowrap}.table{width:160px;height:25px;background:#69432e;border-radius:3px}.table:after{content:"";position:absolute;left:18px;right:18px;top:22px;height:80px;border-left:10px solid #4b3025;border-right:10px solid #4b3025}.cab{width:100px;height:140px;background:#49302f;border:4px solid #70494a}.sofa{width:220px;height:75px;background:#493b4c;border:4px solid #625067;border-radius:14px}.vase{width:34px;height:48px;background:linear-gradient(90deg,#6c3f68,#bd8a9f,#563052);clip-path:polygon(25% 0,75% 0,68% 20%,90% 88%,75% 100%,25% 100%,10% 88%,32% 20%)}.clock{width:48px;height:48px;border-radius:50%;background:#d6c5a0;border:5px solid #4a3348}.clock:after{content:"";position:absolute;left:22px;top:7px;width:2px;height:16px;background:#30202c;transform:rotate(-25deg);transform-origin:bottom}.rug{width:125px;height:18px;background:repeating-linear-gradient(90deg,#58364f 0 12px,#a46d56 12px 15px);border:2px solid #9a6d64}.puddle{width:100px;height:18px;border-radius:50%;background:#304653;border:2px solid #6e8791}.scooter{width:95px;height:38px;border-bottom:5px solid #61566a}.scooter:before{content:"";position:absolute;left:10px;bottom:-8px;width:20px;height:20px;border:4px solid #29232d;border-radius:50%;box-shadow:58px 0 0 -1px #17131a,58px 0 0 3px #65566a}.scooter:after{content:"";position:absolute;left:28px;top:0;width:38px;height:20px;background:#6e435a;border-radius:12px 18px 4px 4px}.lamp{width:14px;height:155px;background:#514151}.lamp:before{content:"";position:absolute;top:0;left:-12px;width:38px;height:12px;background:#b7a16f;box-shadow:0 0 24px #d8bd79}.bench{width:100px;height:30px;background:#654735;border-top:6px solid #a17b58}.bench:after{content:"";position:absolute;left:15px;top:22px;width:8px;height:35px;background:#45332d;box-shadow:62px 0 #45332d}.lightbox{width:48px;height:32px;background:#b5bd9a;border:5px solid #44404a;box-shadow:0 0 22px #cbd39b55}.bed{width:145px;height:55px;background:#56505a;border:4px solid #8a7887}.bed:before{content:"";position:absolute;left:5px;top:-15px;width:32px;height:20px;background:#c4b9bb}.vent{width:58px;height:42px;background:repeating-linear-gradient(0deg,#45414a 0 4px,#93818b 4px 6px);border:3px solid #766573}.speaker{width:45px;height:62px;background:#362532;border:4px solid #8c6a83}.speaker:after{content:"♫";position:absolute;inset:10px;color:#e6b46b;font-size:25px}.clown{width:48px;height:58px;background:#c6b8a1;border:3px solid #7c5a78;border-radius:45% 45% 20% 20%}.clown:after{content:"";position:absolute;left:16px;top:20px;width:8px;height:8px;border-radius:50%;background:#a23c42;box-shadow:-9px -5px 0 -2px #29202a,9px -5px 0 -2px #29202a}.machine{width:58px;height:95px;background:#4c2b4a;border:4px solid #b17b6c}.machine:after{content:"?";position:absolute;left:17px;top:8px;font:bold 35px Georgia;color:#e5bf75}.coat{width:42px;height:82px;background:#27232d;border:2px solid #645365;border-radius:15px 15px 4px 4px}.crack{width:55px;height:110px;background:linear-gradient(110deg,#252c37,#11131a,#4d3a51);border:4px solid #76637d}.crack:after{content:"";position:absolute;left:24px;top:4px;height:90px;width:2px;background:#c8c0c9;transform:rotate(14deg);box-shadow:5px 32px 0 -0.5px #c8c0c9,-7px 54px 0 -0.5px #c8c0c9}.car{position:absolute;bottom:18%;width:350px;height:100px;background:#3c3940;border-radius:60px 80px 15px 15px;border:5px solid #655a65}.car:before,.car:after{content:"";position:absolute;bottom:-25px;width:55px;height:55px;background:#151318;border-radius:50%;border:5px solid #4a414b}.car:before{left:45px}.car:after{right:45px}.car .trunk{position:absolute;right:10px;top:12px;width:95px;height:45px;border:3px solid #7a6b76;background:#302b32}.building{position:absolute;bottom:18%;left:180px;width:950px;height:65%;background:#28272b;border:5px solid #4b4850}.building:before{content:"PADIGLIONE 3";position:absolute;top:20px;left:30px;color:#837b86;font:700 24px monospace;letter-spacing:5px}.win{position:absolute;width:90px;height:110px;background:#11151a;border:4px solid #55515a;bottom:25%}.door2{position:absolute;bottom:18%;left:640px;width:100px;height:190px;background:#111;border:4px solid #5c515c}.wheel{position:absolute;width:300px;height:300px;border:7px solid #826173;border-radius:50%;bottom:20%;left:820px}.wheel:before,.wheel:after{content:"";position:absolute;background:#826173;left:50%;top:50%;transform-origin:left center}.wheel:before{width:140px;height:5px}.wheel:after{width:140px;height:5px;transform:rotate(90deg)}.cabin{position:absolute;width:45px;height:35px;border:3px solid #826173;background:#29202a}.mirrorPanel{position:absolute;bottom:18%;width:120px;height:380px;border:6px solid #6b5871;background:linear-gradient(110deg,#26303b,#12151b,#303946)}.mirrorPanel:after{content:"";position:absolute;inset:20px;border:1px solid #8d7891}.player,.dog{position:absolute;bottom:18%;z-index:10}.player{width:34px;height:70px}.player .head{width:28px;height:28px;border-radius:50%;background:#c99573;position:absolute;top:0;left:3px}.player .body{width:25px;height:35px;background:#496070;position:absolute;top:28px;left:5px;border-radius:4px}.player .legs{position:absolute;bottom:0;left:7px;width:7px;height:18px;background:#24212a;box-shadow:13px 0 #24212a}.dog{width:90px;height:55px}.dog .body{position:absolute;bottom:4px;left:12px;width:68px;height:38px;background:#d6a86d;border-radius:45% 55% 40% 40%;border:2px solid #9b7042}.dog .head{position:absolute;right:0;top:3px;width:45px;height:45px;background:#e0b477;border-radius:48%;border:2px solid #9b7042}.dog .ear{position:absolute;right:35px;top:7px;width:22px;height:30px;background:#8b633e;border-radius:60%;transform:rotate(25deg)}.dog .tail{position:absolute;left:0;bottom:27px;width:28px;height:10px;border-radius:10px;background:#e0b477;transform:rotate(-25deg)}.bubble{position:absolute;bottom:calc(18% + 95px);left:20px;right:20px;min-height:52px;background:#0d0b10e8;border:1px solid #75556f;border-radius:8px;padding:12px 16px;z-index:30;display:none}.bubble.show{display:block}.bubble b{color:#e4b66e}.objectHint{position:absolute;bottom:calc(18% + 5px);z-index:25;background:#0c0a0fdd;border:1px solid #806075;padding:6px 10px;border-radius:5px;display:none;font:13px monospace}.objectHint.show{display:block}.bottom{position:absolute;bottom:0;left:0;right:0;height:72px;background:#0d0a10;z-index:25;border-top:1px solid #3c293c;display:flex;align-items:center;justify-content:space-between;padding:8px 14px}.inv{font-size:12px;color:#bfaec0;max-width:70%;line-height:1.35}.controls{display:flex;gap:5px}.key{border:1px solid #514052;border-radius:4px;padding:5px 8px;color:#d5c5d6;font:12px monospace}.mobile{display:none;position:absolute;right:12px;bottom:80px;z-index:40;gap:5px}.mobile button{width:48px;height:48px;background:#201722dd;color:#eee;border:1px solid #795b73;border-radius:8px;font-size:18px;touch-action:none}.modal{position:absolute;inset:0;background:#09070ddd;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.panel{max-width:700px;background:#17121b;border:1px solid #6d5067;padding:25px;border-radius:8px;line-height:1.55;box-shadow:0 10px 50px #000}.panel h2{color:#e3b675;margin-top:0}.small{font-size:13px;color:#ad9fad}.end{font-size:18px}@media(max-width:700px){.game{height:100vh;border:0}.controls{display:none}.mobile{display:flex}.hint{display:none}.bottom{height:64px}.scene{inset:58px 0 64px}.bubble{bottom:calc(18% + 85px)}.player{transform:scale(.9);transform-origin:bottom}.dog{transform:scale(.85);transform-origin:bottom}}</style></head><body><div class="game"><section class="screen start" id="start"><div><div style="font-size:54px">🎃 ☕</div><h1>LA TAZZA SCOMPARSA</h1><p>Una notte di Halloween. Una tazza rotta. Una storia iniziata nel 1988.</p><button class="btn" id="newBtn">NUOVA PARTITA</button><button class="btn" id="continueBtn" style="display:none">CONTINUA</button><p class="small">← → / A D per camminare · E per interagire · Invio per continuare</p><button class="musicBtn startMusic" id="musicStart">♫ MUSICA: OFF</button></div></section><section class="screen world" id="world"><div class="hud"><div class="place" id="place">CASA</div><div style="display:flex;align-items:center;gap:12px"><div class="hint">← → cammina · E interagisci</div><button class="musicBtn" id="musicToggle">♫ MUSICA: OFF</button></div></div><div class="scene" id="scene"></div><div class="bubble" id="bubble"></div><div class="objectHint" id="objectHint"></div><div class="bottom"><div class="inv" id="inv">Inventario: vuoto</div><div class="controls"><span class="key">←</span><span class="key">→</span><span class="key">E</span><span class="key">INVIO</span></div></div><div class="mobile"><button data-key="left" aria-label="Vai a sinistra">◀</button><button data-key="right" aria-label="Vai a destra">▶</button><button data-key="interact" aria-label="Interagisci o continua">E</button></div></section><div class="modal" id="modal"><div class="panel" id="modalPanel"></div></div></div><script>
(function(){'use strict';
const $=id=>document.getElementById(id);
const SAVE='tazza_scomparsa_save_v5';
const scenes={casa:{name:'CASA',width:1800},parcheggio:{name:'PARCHEGGIO',width:1500},ospedale:{name:'PADIGLIONE 3',width:1900},lunapark:{name:'LUNA PARK',width:1900},specchi:{name:'CASA DEGLI SPECCHI',width:1700}};
const state={scene:'casa',x:220,inv:[],flags:{},discoveries:[],dogX:150,knowledge:0,dialog:null,dialogIndex:0,dialogAfter:null};
let keys={left:false,right:false},last=0;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}}
function has(f){return !!state.flags[f]}
function setFlag(f){state.flags[f]=true;if(!state.discoveries.includes(f))state.discoveries.push(f);save()}
function add(item){if(!state.inv.includes(item))state.inv.push(item);renderInv();save()}
function renderInv(){$('inv').textContent='Inventario: '+(state.inv.length?state.inv.join(' · '):'vuoto')}
function el(c,style,html){const d=document.createElement('div');d.className=c;if(style)d.style.cssText=style;if(html)d.innerHTML=html;return d}
function say(lines,after){state.dialog=lines;state.dialogIndex=0;state.dialogAfter=after||null;showDialog()}
function showDialog(){if(!state.dialog)return;const l=state.dialog[state.dialogIndex];$('bubble').innerHTML='<b>'+l[0]+'</b> '+l[1];$('bubble').classList.add('show')}
function advance(){if(!state.dialog)return false;state.dialogIndex++;if(state.dialogIndex>=state.dialog.length){const a=state.dialogAfter;state.dialog=null;state.dialogAfter=null;$('bubble').classList.remove('show');if(a)a()}else showDialog();return true}
function prop(x,c,label,a){const o=el('prop '+c,'left:'+x+'px','<span class="label">'+label+'</span>');o.dataset.x=x;o.dataset.action=a;return o}
function buildScene(){const root=$('scene');root.innerHTML='';const sc=scenes[state.scene],s=el('strip');s.style.width=sc.width+'px';root.appendChild(s);s.appendChild(el('sky'));for(let i=0;i<32;i++){let z=el('star');z.style.left=Math.random()*sc.width+'px';z.style.top=10+Math.random()*42+'%';s.appendChild(z)}s.appendChild(el('moon'));s.appendChild(el('ground'));if(state.scene==='casa')casa(s);if(state.scene==='parcheggio')parking(s);if(state.scene==='ospedale')hospital(s);if(state.scene==='lunapark')park(s);if(state.scene==='specchi')mirrors(s);let p=el('player');p.id='player';p.innerHTML='<div class="head"></div><div class="body"></div><div class="legs"></div>';s.appendChild(p);let d=el('dog');d.id='dog';d.innerHTML='<div class="body"></div><div class="head"></div><div class="ear"></div><div class="tail"></div>';d.dataset.action='dog';s.appendChild(d);update()}
function casa(s){let r=el('room','left:70px;width:700px');r.innerHTML='<span class="label">CUCINA</span>';s.appendChild(r);s.appendChild(prop(240,'table','Tavolo','cup'));s.appendChild(prop(350,'vase','Vaso','vase'));s.appendChild(prop(520,'cab','Credenza','cabinet'));let win=el('window','left:400px;bottom:48%');win.dataset.action='shadow';win.dataset.x=400;s.appendChild(win);s.appendChild(prop(690,'rug','Tappeto','rug'));let r2=el('room','left:800px;width:700px');r2.innerHTML='<span class="label">SOGGIORNO</span>';s.appendChild(r2);s.appendChild(prop(930,'sofa','Divano','sofa'));s.appendChild(prop(1080,'clock','Orologio','clock'));s.appendChild(prop(1200,'cab','Telefono','phone'));let d=el('door','left:720px');d.dataset.action='door';s.appendChild(d);s.appendChild(prop(1470,'cab','Armadio','wardrobe'))}
function parking(s){let car=el('car','left:260px');car.innerHTML='<div class="trunk"></div>';car.dataset.action='car';car.dataset.x=260;s.appendChild(car);s.appendChild(prop(470,'puddle','Pozza d’acqua','puddle'));s.appendChild(prop(650,'cab','Bagagliaio','box'));s.appendChild(prop(830,'scooter','Motorino','scooter'));s.appendChild(prop(1000,'cab','Registratore','recorder'));s.appendChild(prop(1160,'lamp','Lampione','lamp'));s.appendChild(prop(1240,'bench','Panchina','bench'));let h=el('door','left:80px');h.dataset.action='home';s.appendChild(h);let g=el('door','left:1360px');g.dataset.action='parkingNext';g.innerHTML='<span class="label">Uscita</span>';s.appendChild(g)}
function hospital(s){s.appendChild(el('building'));for(let x=250;x<1150;x+=180)s.appendChild(el('win','left:'+x+'px;bottom:40%'));s.appendChild(prop(340,'lightbox','Neon','lightbox'));s.appendChild(prop(700,'bed','Lettino','bed'));s.appendChild(prop(1280,'vent','Grata','vent'));let d=el('door2');d.dataset.action='hospitalEnter';d.dataset.x=640;s.appendChild(d);s.appendChild(prop(880,'cab','Archivio','archive'));s.appendChild(prop(1120,'cab','Armadietto M.','locker'));s.appendChild(prop(1380,'cab','Registratore','hospitalrec'));s.appendChild(prop(1500,'cab','Foto sul muro','hospitalPhoto'));s.appendChild(prop(1580,'cab','Muro','wall'));s.appendChild(prop(1720,'cab','Stanza laterale','sideRoom'));let e=el('door','left:40px');e.dataset.action='parking';s.appendChild(e)}
function park(s){let g=el('door','left:50px');g.dataset.action='parking';g.innerHTML='<span class="label">Ritorno al parcheggio</span>';s.appendChild(g);s.appendChild(prop(380,'cab','Biglietteria','ticket'));s.appendChild(prop(520,'cab','Foto strappata','tornPhoto'));let w=el('wheel');w.dataset.action='wheel';w.dataset.x=820;s.appendChild(w);for(let i=0;i<8;i++)s.appendChild(el('cabin','left:'+(950+130*Math.cos(i*Math.PI/4))+'px;bottom:'+(35+22*Math.sin(i*Math.PI/4))+'%'));s.appendChild(prop(620,'cab','Cabina di controllo','control'));s.appendChild(prop(1120,'speaker','Altoparlante','speaker'));s.appendChild(prop(1330,'clown','Testa di pagliaccio','clown'));s.appendChild(prop(1510,'machine','Distributore','machine'));let e=el('door','left:1700px');e.dataset.action='mirrors';s.appendChild(e)}
function mirrors(s){s.appendChild(prop(75,'coat','Giacca appesa','coat'));for(let x=180;x<1450;x+=230){let m=el('mirrorPanel','left:'+x+'px');m.dataset.action='mirror';m.dataset.x=x;s.appendChild(m)}s.appendChild(prop(1430,'crack','Specchio incrinato','crack'));let e=el('door','left:1510px');e.dataset.action='home';s.appendChild(e)}
function update(){const root=$('scene'),strip=root.firstElementChild,p=$('player'),d=$('dog');if(!strip||!p||!d)return;p.style.left=state.x+'px';d.style.left=state.dogX+'px';const view=root.clientWidth,off=Math.max(-(scenes[state.scene].width-view),Math.min(0,view/2-state.x));strip.style.transform='translate3d('+off+'px,0,0)';hint()}
function near(){const s=$('scene').firstElementChild;if(!s)return null;let b=null,dist=Infinity;s.querySelectorAll('[data-action]').forEach(o=>{const x=parseFloat(o.dataset.x||o.style.left||0),d=Math.abs(state.x-x);if(d<dist&&d<100){dist=d;b=o}});return b}
function hint(){const o=near(),h=$('objectHint');if(!o){h.classList.remove('show');return}const x=parseFloat(o.dataset.x||o.style.left||state.x);h.textContent='E · '+(o.querySelector('.label')?.textContent||'interagisci');h.style.left=Math.max(10,Math.min($('scene').clientWidth-180,x-state.x+$('scene').clientWidth/2-70))+'px';h.classList.add('show')}
function move(dx){const sc=scenes[state.scene];state.x=Math.max(25,Math.min(sc.width-40,state.x+dx));const gap=state.x-state.dogX;if(Math.abs(gap)>150)state.dogX+=Math.sign(gap)*5;state.dogX+=(state.x-state.dogX)*0.08;update()}
function loop(t){if(!last)last=t;const dt=Math.min(.033,(t-last)/1000);last=t;if(keys.left)move(-300*dt);if(keys.right)move(300*dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function travel(to,x){state.scene=to;state.x=x||180;state.dogX=Math.max(25,state.x-75);save();buildScene();$('place').textContent=scenes[to].name;intro(to);finishCheck()}
function intro(to){if(to==='casa'&&!has('intro')){setFlag('intro');say([['','Ma dove xé finia la me tazza?'],['','Il Golden ti guarda. Fa finta di niente.'],['','È Halloween. Fuori è già buio.']])}if(to==='parcheggio'&&!has('parkIntro')){setFlag('parkIntro');say([['','Il vecchio parcheggio è quasi vuoto. Il cane annusa l’aria.'],['','Quella macchina... ti sembra stranamente familiare.']])}if(to==='ospedale'&&!has('hospitalIntro')){setFlag('hospitalIntro');say([['','Il cane si irrigidisce. Davanti a voi c’è il Padiglione 3.'],['','Le finestre sono nere. Non sembra esserci nessuno.']])}if(to==='lunapark'&&!has('parkIntro2')){setFlag('parkIntro2');say([['','Il luna park è spento. Solo la ruota panoramica è illuminata.'],['','Il cane tira leggermente il guinzaglio verso l’interno.']])}if(to==='specchi'&&!has('mirrorIntro')){setFlag('mirrorIntro');say([['','La casa degli specchi è aperta. Dentro non si sente nulla.'],['','Poi, per un attimo, nello specchio dietro di te compaiono due persone.']])}}
function action(a){
if(a==='dog'){
  const key='dogMoment_'+state.scene;
  if(!has(key)){
    setFlag(key);
    if(state.scene==='casa')say([['Tu','Cossa te ga? Te si drio fissarme da mezz’ora.'],['','Il cane sbadiglia e si gira dall’altra parte.'],['Tu','Ah, scusa. Te gavevo interrotto nel tuo importantissimo lavoro de far gnente.']]);
    else if(state.scene==='parcheggio')say([['Tu','Almeno ti te pari tranquillo.'],['','Il Golden annusa una ruota, starnutisce e ti guarda come se fosse colpa tua.'],['Tu','Sì, certo. El parcheggio xe pien de misteri e ti te ga trovato el profumo de una gomma.']]);
    else if(state.scene==='ospedale')say([['','Il cane si ferma, drizza le orecchie e guarda il corridoio.'],['Tu','No. Se ti te fermi così, mi no vado a vedere.'],['','Il cane ti guarda. Poi riprende a camminare, lasciandoti lì a fare la figura del fifone.']]);
    else if(state.scene==='lunapark')say([['Tu','Se te trovi un altro pezzo de tazza, te lo magnì. Chiaro?'],['','Il cane inclina la testa, perfettamente innocente.'],['Tu','Quella faccia lì no la funziona più.']]);
    else say([['','Il cane si mette davanti a uno specchio. Il riflesso sembra arrivare un istante in ritardo.'],['Tu','No, no. Non cominciamo anca ti.'],['','Il cane si siede. Il riflesso, stavolta, lo imita subito.']]);
  }else say([['Tu',state.scene==='casa'?'Se te podessi parlare, probabilmente chiederesti da magnare.':state.scene==='parcheggio'?'Annusa pure, ma se trovi un cadavere stavolta lo spieghi tu.':state.scene==='ospedale'?'Se te metti a ringhiare, mi me ne vado.':'Basta con quella faccia da angioletto.']]);

function stop(){keys.left=false;keys.right=false;save()}document.querySelectorAll('.mobile button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();if(b.dataset.key==='left')keys.left=true;else if(b.dataset.key==='right')keys.right=true;else interact()});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,stop))});
})();</script>
