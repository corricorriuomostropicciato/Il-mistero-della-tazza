<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mistero della tazza</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #ff5722;
            --accent-hover: #f4511e;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        #game-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #181818;
            padding: 12px 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #audioToggleBtn {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        #audioToggleBtn:hover {
            background-color: #444;
        }

        #audioToggleBtn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-hover);
        }

        #story-panel {
            padding: 25px;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 140px;
            max-height: 250px;
            overflow-y: auto;
            border-bottom: 1px solid var(--border-color);
        }

        #choices-panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #181818;
        }

        .choice-btn {
            background-color: #2a2a2a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .choice-btn:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-hover);
            transform: translateX(4px);
        }

        #inventory-panel {
            padding: 10px 20px;
            background-color: #151515;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <h1>☕ Il mistero della tazza</h1>
            <button id="audioToggleBtn" onclick="toggleAudio()">Audio: OFF</button>
        </header>

        <div id="story-panel">
            Che freddo cane in questa cucina. Mi guardo intorno e c'è una puzza di umido incredibile. Sul tavolo di legno logoro c'è una tazza misteriosa che emana una strana luce verdastra... Ma cossa xé sta roba?
        </div>

        <div id="choices-panel">
            <button class="choice-btn" onclick="makeChoice(1)">1. Esamina la tazza da vicino</button>
            <button class="choice-btn" onclick="makeChoice(2)">2. Cerca un interruttore della luce</button>
            <button class="choice-btn" onclick="makeChoice(3)">3. Fuggi via urlando</button>
        </div>

        <div id="inventory-panel">
            Inventario: Vuoto
        </div>
    </div>

    <script>
        // --- MOTORE AUDIO RETRO HORROR-DEMENZIALE (LOOP CONTINUO) ---
        let audioCtx = null;
        let isPlaying = false;
        let nextNoteTime = 0.0;
        let currentStep = 0;
        let timerID = null;

        const tempo = 135;
        const secondsPerBeat = 60.0 / tempo;
        const stepTime = secondsPerBeat / 2;

        const NOTES = {
            'A2': 110.00, 'C3': 130.81, 'E3': 164.81, 'F3': 174.61, 
            'G#3': 207.65, 'A3': 220.00, 'C4': 261.63, 'D4': 293.66, 
            'E4': 329.63, 'F4': 349.23, 'G#4': 415.30, 'A4': 440.00,
            'REST': 0
        };

        const melodyPattern = [
            'A4', 'C4', 'E4', 'A4', 'G#4', 'E4', 'C4', 'REST',
            'F4', 'E4', 'D4', 'F4', 'E4', 'C4', 'A3', 'REST',
            'A4', 'C4', 'E4', 'F4', 'G#4', 'A4', 'C5', 'B4',
            'A4', 'G#4', 'F4', 'E4', 'D4', 'C4', 'B3', 'E4'
        ];

        const bassPattern = [
            'A2', 'A2', 'C3', 'A2', 'E3', 'E3', 'C3', 'E3',
            'F3', 'F3', 'A2', 'F3', 'E3', 'D3', 'C3', 'B2',
            'A2', 'A2', 'C3', 'A2', 'F3', 'F3', 'G#3', 'G#3',
            'A2', 'E3', 'F3', 'E3', 'D3', 'C3', 'B2', 'E3'
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, time, duration, type, volume) {
            if (freq === 0) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, time);
            
            gain.gain.setValueAtTime(0.001, time);
            gain.gain.linearRampToValueAtTime(volume, time + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(time);
            osc.stop(time + duration);
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + 0.1) {
                let noteNameM = melodyPattern[currentStep];
                let noteNameB = bassPattern[currentStep];
                
                let freqM = NOTES[noteNameM] || 0;
                let freqB = NOTES[noteNameB] || 0;
                
                playTone(freqM, nextNoteTime, stepTime * 0.85, 'square', 0.08);
                playTone(freqB, nextNoteTime, stepTime * 0.9, 'triangle', 0.12);
                
                nextNoteTime += stepTime;
                currentStep = (currentStep + 1) % melodyPattern.length;
            }
        }

        function startMusicLoop() {
            if (isPlaying) return;
            initAudio();
            isPlaying = true;
            currentStep = 0;
            nextNoteTime = audioCtx.currentTime + 0.05;
            timerID = setInterval(scheduler, 25);
        }

        function stopMusicLoop() {
            isPlaying = false;
            if (timerID) {
                clearInterval(timerID);
                timerID = null;
            }
        }

        function toggleAudio() {
            const audioBtn = document.getElementById('audioToggleBtn');
            if (isPlaying) {
                stopMusicLoop();
                if (audioBtn) {
                    audioBtn.innerText = "Audio: OFF";
                    audioBtn.classList.remove('active');
                }
            } else {
                startMusicLoop();
                if (audioBtn) {
                    audioBtn.innerText = "Audio: ON";
                    audioBtn.classList.add('active');
                }
            }
        }

        // --- LOGICA DEL GIOCO E BATTUTE DEL PROTAGONISTA AGGIORNATE ---
        function makeChoice(option) {
            const storyPanel = document.getElementById('story-panel');
            const choicesPanel = document.getElementById('choices-panel');
            const inventoryPanel = document.getElementById('inventory-panel');

            if (option === 1) {
                storyPanel.innerHTML = "Mi avvicino lentamente, schifato. La tazza brilla di un verde fosforescente e si sente un gorgoglio strano... Ma che schifezza è? Dentro c'è un liquido denso che bolle da solo. Va in mona, non la tocco neanche morto.";
                inventoryPanel.innerHTML = "Inventario: Tazza Misteriosa";
                choicesPanel.innerHTML = `
                    <button class="choice-btn" onclick="makeChoice(10)">A. Bevi il liquido misterioso</button>
                    <button class="choice-btn" onclick="makeChoice(11)">B. Rimetti la tazza a posto</button>
                `;
            } else if (option === 2) {
                storyPanel.innerHTML = "Vado a tastoni lungo il muro freddo finché trovo l'interruttore. Click! La lampadina si accende sfarfallando e vedo delle scritte assurde sul muro. Ma perché mi succedono tutte a me?";
                choicesPanel.innerHTML = `
                    <button class="choice-btn" onclick="makeChoice(20)">A. Leggi le scritte sul muro</button>
                    <button class="choice-btn" onclick="makeChoice(1)">B. Torna alla tazza</button>
                `;
            } else if (option === 3) {
                storyPanel.innerHTML = "Provo a correre verso la porta, ma è sbarrata! Maledizione, è chiusa a chiave. Una voce metallica dagli altoparlanti gracchia: <i>'La tazza deve essere svuotata...'</i> Ma vaffan... chi è che parla?!";
                choicesPanel.innerHTML = `
                    <button class="choice-btn" onclick="makeChoice(1)">A. Torna sui tuoi passi verso la tazza</button>
                `;
            } else {
                storyPanel.innerHTML = "La storia continua... No me piasé affatto come va a finire. (Fine della demo del prototipo)";
                choicesPanel.innerHTML = `
                    <button class="choice-btn" onclick="location.reload()">Ricomincia da capo</button>
                `;
            }
        }
    </script>
</body>
</html>
